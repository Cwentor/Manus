<article class="blog-card" data-slug="{{SLUG}}" data-tags="{{TAGS_RAW}}" data-index="{{INDEX}}" tabindex="0" role="button" aria-label="阅读：{{TITLE}}">
  <time class="blog-date" datetime="{{DATE_FULL}}">{{DATE}}</time>
  <h3 class="blog-title">{{TITLE}}</h3>
  <p class="blog-summary">{{SUMMARY}}</p>
  <div class="blog-meta">
    <span class="blog-read">{{READ_TIME}} 阅读</span>
    <span class="blog-tags">{{TAGS}}</span>
  </div>
</article>
