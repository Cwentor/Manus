<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="工作台 — 文档阅读器：左侧分类导航，右侧本文目录">
  <title>{{PROFILE_NAME}} · 工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
  <!-- 霞鹜文楷（博客迁移品牌字体；加载失败自动回退系统字体栈） -->
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>
<body>

  <!-- 暗色主题动态星空 -->
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <!-- ================================================================== -->
  <!-- 导航栏（主页 / 工作台 双页切换）                                     -->
  <!-- ================================================================== -->
  <nav class="navbar" aria-label="主导航">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">{{PROFILE_NAME}}</a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">主页</a>
        <a class="nav-link is-active" href="workspace.html" aria-current="page">工作台</a>
        <button class="theme-toggle" aria-label="切换主题" type="button">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.73 12.73 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ================================================================== -->
  <!-- 三栏阅读器：左 = 分类文档树（文件夹可折叠） / 中 = 当前文档 / 右 = 目录 -->
  <!-- ================================================================== -->
  <div class="ws-shell">

    <!-- 左栏：查找 + 文档树 -->
    <aside class="ws-sidebar" id="ws-sidebar" aria-label="文档导航">
      <button class="ws-sidebar-close" id="ws-sidebar-close" aria-label="关闭目录" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="doc-search" id="doc-search">
        <svg class="doc-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" class="doc-search-input" placeholder="查找文档…" aria-label="查找文档" autocomplete="off">
        <kbd class="doc-search-kbd" aria-hidden="true">Ctrl+K</kbd>
        <button class="doc-search-clear" aria-label="清空查找" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>

        <!-- 搜索结果面板（Zensical 风格：结果计数 + 面包屑 + 关键词高亮摘要，app.js 渲染；
             点击结果在工作台阅读器内打开） -->
        <div class="search-results" id="search-results" hidden></div>
      </div>

      <nav class="ws-tree" id="ws-tree" aria-label="文档目录">
        <!-- 树由 app.js 依据 #ws-tree-data 渲染：分类 / 子文件夹可折叠，文档可点开阅读 -->
      </nav>

      <div class="ws-sidebar-foot">
        <p class="footer-hitokoto" data-hitokoto hidden></p>
        <p class="ws-build-meta">{{BUILD_META}}</p>
      </div>
    </aside>

    <!-- 移动端侧栏遮罩 -->
    <div class="ws-overlay" id="ws-overlay" hidden></div>

    <!-- 中栏：当前文档阅读区 -->
    <main class="ws-reader" id="ws-reader">
      <div class="ws-topbar">
        <button class="ws-menu-btn" id="ws-menu-btn" aria-label="打开文档目录" aria-controls="ws-sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <nav class="ws-breadcrumb" id="ws-breadcrumb" aria-label="面包屑"></nav>
      </div>

      <div class="ws-reader-inner">
        <div class="ws-empty" id="ws-empty">
          <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <p>从左侧选择一篇文档开始阅读<br><small>支持 Ctrl+K 全文查找</small></p>
        </div>

        <article class="ws-doc" id="ws-doc" hidden>
          <header class="article-head" id="ws-doc-head"></header>
          <div class="article ws-doc-body" id="ws-doc-body"></div>
          <nav class="ws-pager" id="ws-pager" aria-label="上一篇 / 下一篇"></nav>
        </article>
      </div>
    </main>

    <!-- 右栏：当前文档目录（TOC） -->
    <aside class="ws-toc" id="ws-toc" aria-label="本文目录">
      <p class="ws-toc-title">目录</p>
      <nav class="ws-toc-list" id="ws-toc-list"></nav>
    </aside>
  </div>

  <!-- 目录树数据（构建期生成：分类 → 子目录 → 文档） -->
  <script type="application/json" id="ws-tree-data">{{WORKSPACE_TREE}}</script>

  <!-- 正文搜索索引（构建期生成：slug -> 纯文本正文，前端零请求匹配） -->
  <script type="application/json" id="doc-search-index">{{SEARCH_INDEX}}</script>

  <script src="js/app.js" defer></script>
</body>
</html>
