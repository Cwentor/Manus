<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} · {{PROFILE_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
  <!-- 霞鹜文楷（博客迁移品牌字体；加载失败自动回退系统字体栈） -->
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- 暗色主题动态星空 -->
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <!-- ================================================================== -->
  <!-- 导航栏                                                              -->
  <!-- ================================================================== -->
  <nav class="navbar" aria-label="主导航">
    <div class="nav-inner">
      <a class="nav-logo" href="/index.html">{{PROFILE_NAME}}</a>
      <div class="nav-links">
        <a class="nav-link" href="/index.html">主页</a>
        <a class="nav-link is-active" href="/workspace.html">工作台</a>
        <button class="theme-toggle" aria-label="切换主题" type="button">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.73 12.73 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ================================================================== -->
  <!-- 文章整页阅读                                                        -->
  <!-- ================================================================== -->
  <main class="article-page">
    <div class="container article-container">
      <a class="article-back" href="/workspace.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        返回工作台
      </a>

      <header class="article-head">
        <div class="article-chips">
          <span class="doc-kind doc-kind-{{KIND}}">{{KIND_LABEL}}</span>
          {{META_CHIPS}}
        </div>
        <h1 class="article-title">{{TITLE}}</h1>
        {{EXTRA_HEAD}}
      </header>

      <article class="article">{{BODY}}</article>

      <footer class="article-foot">
        <a class="article-back" href="/workspace.html">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          返回工作台
        </a>
      </footer>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-hitokoto" data-hitokoto hidden></p>
      <p class="footer-text">{{BUILD_META}}</p>
    </div>
  </footer>

  <script src="/js/app.js" defer></script>
</body>
</html>
