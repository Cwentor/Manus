<article class="product-card tilt" data-status="{{STATUS_CLASS}}" data-index="{{INDEX}}">
  <div class="product-cover">
    <img src="{{COVER}}" alt="{{TITLE}}" loading="lazy">
    <span class="badge badge-{{STATUS_CLASS}}">{{STATUS}}</span>
  </div>
  <div class="product-body">
    <h3 class="product-title">{{TITLE}}</h3>
    <p class="product-tagline">{{TAGLINE}}</p>
    <div class="product-tech">{{TECH}}</div>
  </div>
  <div class="product-actions">
    <a class="btn btn-text" href="{{DEMO_URL}}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span>Demo</span>
    </a>
    <a class="btn btn-text" href="{{REPO_URL}}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      <span>GitHub</span>
    </a>
    <button class="btn btn-primary" data-open-article="{{SLUG}}" type="button">
      <span>了解详情</span>
    </button>
  </div>
</article>
