  <circle cx="100" cy="100" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="100" cy="100" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  <text x="100" y="104" text-anchor="middle" dominant-baseline="central"
