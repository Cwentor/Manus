<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="开源集邮册 — 把收藏的开源项目做成纪念邮票墙">
<!-- 主题预置：CSS 解析前就定下 data-theme，与主页 / 工作台共用同一个 key，避免跳页闪色 -->
<script>
  (() => {
    try {
      const saved = localStorage.getItem('showcase-theme');
      document.documentElement.dataset.theme =
        saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) { /* 隐私模式禁用存储时沿用模板默认值 */ }
  })();
</script>
<title>开源集邮册 · 陈文涛</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://github.com">
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<!-- 霞鹜文楷：与其他页面同一套品牌字体，加载失败自动回退系统字体栈 -->
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- ================================================================== -->
  <!-- 导航栏（与主页 / 工作台同款玻璃条，三页互通 + 亮暗切换）             -->
  <!-- ================================================================== -->
  <nav class="navbar" aria-label="主导航">
    <div class="nav-inner">
      <a class="nav-logo" href="../index.html">陈文涛</a>
      <div class="nav-links">
        <a class="nav-link" href="../index.html">主页</a>
        <a class="nav-link is-active" href="./index.html" aria-current="page">集邮册</a>
        <a class="nav-link" href="../workspace.html">工作台</a>
        <button class="theme-toggle" aria-label="切换主题" type="button">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.73 12.73 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ================================================================== -->
  <!-- 页面头：馆名 + 检索工具（玻璃卡）                                   -->
  <!-- ================================================================== -->
  <header class="album-head">
    <div class="album-title">
      <span class="album-mark" aria-hidden="true">✦</span>
      <div>
        <h1 class="album-name">开源集邮册</h1>
        <p class="album-sub">OPEN SOURCE STAMP ALBUM</p>
      </div>
    </div>
    <div class="toolbar">
      <input id="search" class="ctl search" type="search" placeholder="搜索票名 / 简介…" aria-label="搜索票名或简介">
      <select id="lang" class="ctl select" aria-label="按票种筛选"><option value="">全部票种</option></select>
      <select id="sort" class="ctl select" aria-label="排序方式">
        <option value="stars">按面值 ★</option>
        <option value="name">按票名</option>
        <option value="created">按发行年份</option>
      </select>
    </div>
    <div id="count" class="count"></div>
  </header>

  <main id="grid" class="album" aria-label="邮票墙"></main>
  <div id="empty" class="empty" hidden>册子里没有匹配的邮票</div>

  <!-- ================================================================== -->
  <!-- 详情弹层                                                            -->
  <!-- ================================================================== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="邮票详情">
      <button class="modal-close" data-close aria-label="关闭">×</button>
      <div class="modal-head">
        <div class="modal-vig"><img id="m-avatar" alt="" onerror="this.style.visibility='hidden'"></div>
        <div>
          <div id="m-name" class="modal-name"></div>
          <div id="m-owner" class="modal-owner"></div>
        </div>
      </div>
      <p id="m-deprecated" class="modal-deprecated" hidden></p>
      <p id="m-zh" class="modal-zh"></p>
      <p id="m-en" class="modal-en"></p>
      <div id="m-topics" class="modal-topics"></div>
      <div class="modal-stats">
        <div class="stat"><b id="m-stars"></b><span>面值 ★</span></div>
        <div class="stat"><b id="m-forks"></b><span>Forks</span></div>
        <div class="stat"><b id="m-lang"></b><span>票种</span></div>
        <div class="stat"><b id="m-created"></b><span>发行年份</span></div>
      </div>
      <div class="pm-picker">
        <span class="pm-picker-label">邮戳</span>
        <div id="pm-options" class="pm-options" role="group" aria-label="选择邮戳样式"></div>
      </div>
      <div class="modal-links">
        <a id="m-repo" class="btn-ink" target="_blank" rel="noopener">打开仓库 ↗</a>
        <a id="m-ownerlink" class="btn-ink ghost" target="_blank" rel="noopener">作者主页 ↗</a>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
